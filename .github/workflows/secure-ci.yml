name: Secure CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r task-1/app/requirements.txt
      - name: Gitleaks secret scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact

      - name: Semgrep SAST scan
        run: |
          pip install semgrep
          semgrep scan --config auto task-1/app
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ledger-api:${{ github.sha }} task-1/app
      - name: Push Docker image to GHCR
        run: |
          docker tag ledger-api:${{ github.sha }} ghcr.io/harshita3001/ledger-api:${{ github.sha }}
          docker push ghcr.io/harshita3001/ledger-api:${{ github.sha }}
      - name: Sign Docker image with Cosign
        run: |
          cosign sign --yes ghcr.io/harshita3001/ledger-api:${{ github.sha }}
      - name: Generate SLSA provenance
        run: |
          cat > provenance.json <<'EOF'
          {
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions"
            },
            "buildType": "https://github.com/Actions",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                }
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}"
            },
            "materials": []
          }
          EOF

          cosign attest --yes \
            --predicate provenance.json \
            --type slsaprovenance \
            ghcr.io/harshita3001/ledger-api:${{ github.sha }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ledger-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'