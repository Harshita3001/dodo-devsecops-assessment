apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporting
  namespace: payments
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
    spec:
      serviceAccountName: reporting
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reporting
          image: curlimages/curl:8.12.1
          command: ["sh", "-c", "sleep infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            exec:
              command: ["sh", "-c", "true"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "true"]
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: reporting
  namespace: payments
spec:
  selector:
    app: reporting
  ports:
    - port: 8080
      targetPort: 8080